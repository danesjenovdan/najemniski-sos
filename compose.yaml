volumes:
  postgres-data:

services:
  wagtail:
    build: ./stanovanja
    command: ./manage.py runserver 0.0.0.0:8000
    volumes:
      - ./stanovanja:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_RUNSERVER_HIDE_WARNING: "true"
      DB_HOST: db
      DB_NAME: najemniski_sos
      DB_USERNAME: najemniski_sos
      DB_PASSWORD: changeme
    depends_on:
      - db

  sass-compile:
    build: ./sass-compile
    command: npm run watch
    volumes:
      - ./sass-compile/scss:/app/scss
      - ./stanovanja/stanovanja/static:/app/static
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    environment:
      POSTGRES_DB: najemniski_sos
      POSTGRES_USER: najemniski_sos
      POSTGRES_PASSWORD: changeme
